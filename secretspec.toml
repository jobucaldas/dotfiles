# Run a command with `secretspec run --scope github -- <command>`
# BWS access still follows the machine token's permissions

[project]
name = "dotfiles"
revision = "1.0"

[providers]
bitwarden = { uri = "bws://78b13868-2d56-4644-8993-b49100db64c9" }

[profiles.default.defaults]
providers = ["bitwarden"]

[profiles.default]
GH_TOKEN = {
  description = "GitHub CLI token stored in the BWS home-lab project",
  ref = { item = "DOTFILES_GH_TOKEN" },
}

TAILSCALE_KEY = {
  description = "Existing tailnet key stored in the BWS home-lab project",
  ref = { item = "TAILSCALE_KEY" },
}

[scopes.github]
secrets = ["GH_TOKEN"]

[scopes.tailscale]
secrets = ["TAILSCALE_KEY"]
