config_version = 13

[bar.default]
center = [ "notifications", "clock", "caffeine" ]
concave_edge_corners = false
end = [ "tray", "clipboard", "status", "network", "bluetooth", "volume", "battery", "widget", "control-center" ]
margin_edge = 4
margin_ends = 4
start = [ "workspaces", "group:g1", "weather", "audio_visualizer" ]
thickness = 40

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface"
    id = "g1"
    members = [ "cpu", "ram" ]
    opacity = 1.0
    padding = 6.0

[control_center]
hidden_tabs = [ "media", "audio", "monitor", "power", "network", "bluetooth", "weather", "calendar", "notifications" ]
sidebar = "none"
sidebar_section = "none"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 112.0
    box_width = 208.0
    cx = 1416.0
    cy = 126.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        bands = 32
        show_when_idle = true

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 128.0
    box_width = 208.0
    cx = 1416.0
    cy = 256.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        stat = "cpu_usage"
        stat2 = "cpu_temp"

[location]
address = "Sao Carlos, SP"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000002"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 898.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 478.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 112.0
    box_width = 800.0
    cx = 768.0
    cy = 192.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = true
        clock_style = "digital"
        font_family = ""
        format = "{:%d/%m/%Y %H:%M}"

[plugins]
enabled = [ "davemhammer/tailscale", "weinguyen/opencode-companion" ]

[shell]
font_family = "Monaspace Argon"
panel_anchor_bar = "default"
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    open_near_click_control_center = true

    [shell.screenshot]
    directory = "/home/jobu/Pictures/Screenshots"

[theme]
builtin = "Dracula"
community_palette = "Peche"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "kitty", "mango", "qt" ]
    community_ids = [ "opencode", "pi-agent", "vscode", "heroiclauncher" ]

[wallpaper]
directory = "/home/jobu/Pictures/Wallpapers"
fill_color = "#000000"
fill_mode = "fit"

    [wallpaper.default]
    path = "/home/jobu/Pictures/Wallpapers/scott.jpg"

    [wallpaper.last]
    path = "/home/jobu/Pictures/Wallpapers/scott.jpg"

[widget.audio_visualizer]
interactive = false
show_when_idle = true

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.clock]
anchor = true
format = "{:%d/%m/%Y %H:%M}"

[widget.control-center]
glyph = "adjustments-horizontal"

[widget.cpu]
interactive = false

[widget.network]
show_label = false

[widget.ram]
interactive = false

[widget.status]
type = "davemhammer/tailscale:status"

[widget.volume]
glyph = "volume"

[widget.widget]
type = "weinguyen/opencode-companion:widget"

[widget.workspaces]
active_pill_size = 2.0
capsule_radius = 13
empty_color = "primary"
occupied_color = "primary"
