HOW_TO_unencrypted: |-
    WHAT THIS FILE DOES
    This SOPS-encrypted file contains each machine’s existing jobu login-password hash and a Tailscale auth key. It is safe to commit while it remains encrypted.

    AGE KEY
    The private age key is installed at /var/lib/sops-nix/key.txt on both encom and sauron. Keep your local ~/.config/sops/age/keys.txt backup private; never commit it.

    EDITING SECRETS
    Run `sops flake/secrets/dotfiles.enc.yaml` from the repository root, edit only the value you intend to change, then save and exit. To intentionally change a machine login password, generate its hash with `mkpasswd -m yescrypt` and update only that machine’s key: jobu-password-hash-encom or jobu-password-hash-sauron. Never put a plain password here.

    TAILSCALE
    The current auth key was copied from the BWS home-lab secret TAILSCALE_KEY. If it expires, make a reusable auth key in the Tailscale admin console, store the new value in BWS, then update tailscale-authkey here with SOPS.

    CHECK AND REBUILD
    To check decryption without changing the file: `SOPS_AGE_KEY_FILE=$HOME/.config/sops/age/keys.txt sops -d flake/secrets/dotfiles.enc.yaml`. Do not share the decrypted output. After reviewing other configuration changes, rebuild with `sudo nixos-rebuild switch --flake ~/Projects/dotfiles/flake#encom` or `#sauron`. Disko formatting is not part of a normal rebuild.
