# Vulnix whitelist — false positives caused by pname-only matching.
#
# vulnix matches Nix `pname` against NVD products with a coarse heuristic,
# so Haskell/Python/Go build inputs routinely match unrelated CVEs
# (npm, Ruby, Jenkins plugins, appliances, browsers, ...).
# Each entry below was triaged from GitHub code-scanning alerts
# (categories vulnix-encom / vulnix-sauron).
#
# Syntax: https://github.com/nix-community/vulnix#whitelisting
#   ["pname"]            — all versions
#   ["pname-version"]    — single version
#   cve = [...]          — only these CVEs (omit to whitelist all CVEs
#                          currently reported for that package)
#
# Re-check entries periodically; remove once vulnix matching improves
# or the package leaves the closure (`nix why-depends`).

# Haskell `tar` (0.6.x) vs npm `node-tar` / GNU tar (nixpkgs: gnutar).
["tar"]
comment = "Haskell tar library, not node-tar (npm) nor GNU tar. Alerts 490/510 etc."

