name: Deploy Nix Host

on:
  workflow_call:
    inputs:
      host:
        description: Host to build, push and activate
        type: string
        required: true

jobs:
  reuse:
    name: Find PR build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - name: Find PR build with the same tree
        id: find
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HOST: ${{ inputs.host }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          [ "$EVENT" = push ] || exit 0

          # A matching tree means a matching flake, so the PR's closure is this commit's closure.
          TREE="$(gh api "repos/${REPO}/commits/${SHA}" --jq .commit.tree.sha)"
          for HEAD in $(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '.[] | select(.merged_at != null) | .head.sha'); do
            [ "$(gh api "repos/${REPO}/commits/${HEAD}" --jq .commit.tree.sha)" = "$TREE" ] || continue
            for RUN in $(gh run list --repo "$REPO" --workflow ci.yml --event pull_request --commit "$HEAD" --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId'); do
              if [ -n "$(gh api "repos/${REPO}/actions/runs/${RUN}/artifacts?name=build-${HOST}" --jq '.artifacts[] | select(.expired | not) | .id')" ]; then
                echo "Reusing build from run ${RUN} (PR head ${HEAD})"
                echo "run-id=${RUN}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          echo "No PR build for tree ${TREE}; building"

  build:
    needs: reuse
    if: ${{ needs.reuse.outputs.run-id == '' }}
    uses: ./.github/workflows/build-host.yml
    with:
      host: ${{ inputs.host }}
    secrets: inherit
    permissions:
      contents: read
      security-events: write

  activate:
    name: Deploy with deploy-rs
    needs: [reuse, build]
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    environment: prod
    permissions:
      actions: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Tailscale OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:gha

      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: jobucaldas
          authToken: ${{ secrets.CACHIX_TOKEN }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          cat > ~/.ssh/config <<'EOF'
          Host sauron encom *.tailbe71e1.ts.net
            StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      - name: Download build path
        uses: actions/download-artifact@v8
        with:
          name: build-${{ inputs.host }}
          path: flake
          run-id: ${{ needs.reuse.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Check host status
        id: status
        working-directory: ./flake
        env:
          HOST: ${{ inputs.host }}
        run: |
          BUILD="$(cat "build-${HOST}")"
          DEPLOY_PROFILE="$(cat "deploy-profile-${HOST}")"

          if ! ssh -o ConnectTimeout=15 -o ConnectionAttempts=2 "deploy@${HOST}" true; then
            echo "SKIP | ${HOST} did not accept SSH, leaving it unchanged."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT="$(ssh -o ConnectTimeout=10 "deploy@${HOST}" 'readlink /run/current-system' 2>/dev/null || true)"
          PROFILE="$(ssh -o ConnectTimeout=10 "deploy@${HOST}" 'readlink -f /nix/var/nix/profiles/system' 2>/dev/null || true)"
          if [ -n "$CURRENT" ] && [ "$CURRENT" = "$BUILD" ] && [ "$PROFILE" = "$DEPLOY_PROFILE" ]; then
            echo "SKIP | ${HOST} already on $BUILD, nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Deploy system profile
        if: steps.status.outputs.deploy == 'true'
        working-directory: ./flake
        env:
          HOST: ${{ inputs.host }}
        # Use the pinned binary that has a cache on GitHub runners
        run: |
          attempt=1
          until nix run github:NixOS/nixpkgs/efe6f071ede9d21c37462d2d6682d5e670099684#deploy-rs -- ".#${HOST}"; do
            if [ "$attempt" -ge 3 ]; then
              exit 1
            fi
            echo "deploy-rs failed (attempt ${attempt}); retrying in 20s"
            attempt=$((attempt + 1))
            sleep 20
          done

  verify:
    name: Verify Nix generation
    needs: [reuse, activate]
    if: ${{ !cancelled() && (needs.activate.result == 'success' || needs.activate.result == 'failure') }}
    permissions:
      actions: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Tailscale OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:gha

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          cat > ~/.ssh/config <<'EOF'
          Host sauron encom *.tailbe71e1.ts.net
            StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      - name: Download build path
        uses: actions/download-artifact@v8
        with:
          name: build-${{ inputs.host }}
          run-id: ${{ needs.reuse.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Check deploy status
        env:
          HOST: ${{ inputs.host }}
        run: |
          BUILD="$(cat "build-${HOST}")"
          DEPLOY_PROFILE="$(cat "deploy-profile-${HOST}")"

          if ! ssh -o ConnectTimeout=15 -o ConnectionAttempts=2 "deploy@${HOST}" true; then
            echo "SKIP | ${HOST} did not accept SSH, not waiting for it."
            exit 0
          fi

          for _ in $(seq 1 30); do
            CURRENT="$(ssh -o ConnectTimeout=10 "deploy@${HOST}" 'readlink /run/current-system' 2>/dev/null || true)"
            PROFILE="$(ssh -o ConnectTimeout=10 "deploy@${HOST}" 'readlink -f /nix/var/nix/profiles/system' 2>/dev/null || true)"
            if [ "$CURRENT" = "$BUILD" ] && [ "$PROFILE" = "$DEPLOY_PROFILE" ]; then
              echo "SUCCESS | Generation live and recorded: $CURRENT"
              exit 0
            fi
            sleep 20
          done

          echo "Deployment failed for ${HOST} (live: $CURRENT, profile: $PROFILE, want: system=$BUILD profile=$DEPLOY_PROFILE)"
          exit 1
