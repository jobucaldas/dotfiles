name: Validate Nix Flake

on:
  workflow_call:

jobs:
  validate:
    name: Validate Nix Flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Format Nix Flake
        working-directory: ./flake
        run: nix fmt

      - name: Validate Nix Flake
        working-directory: ./flake
        run: nix flake check
