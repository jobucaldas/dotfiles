name: Deploy Nix Hosts

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-nix-hosts
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  push:
    name: Push Nix closure
    needs: ci
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deploy_host: [encom, sauron]
    steps:
      - name: Tailscale OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:gha

      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: jobucaldas
          authToken: ${{ secrets.CACHIX_TOKEN }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          cat > ~/.ssh/config <<'EOF'
          Host sauron encom *.tailbe71e1.ts.net
            StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      - name: Download build path
        uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.deploy_host }}
          path: flake

      - name: Push system closure
        working-directory: ./flake
        run: |
          BUILD="$(cat "build-${{ matrix.deploy_host }}")"

          CURRENT="$(ssh -o ConnectTimeout=10 "deploy@${{ matrix.deploy_host }}" 'readlink /run/current-system' 2>/dev/null || true)"
          if [ -n "$CURRENT" ] && [ "$CURRENT" = "$BUILD" ]; then
            echo "SKIP | ${{ matrix.deploy_host }} already on $BUILD, nothing to push."
            exit 0
          fi

          nix build ".#nixosConfigurations.${{ matrix.deploy_host }}.config.system.build.toplevel" --print-out-paths --no-link > /dev/null
          nix copy --to "ssh://deploy@${{ matrix.deploy_host }}" "$BUILD"

  activate:
    name: Activate Nix generation
    needs: push
    environment: prod
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deploy_host: [encom, sauron]
    steps:
      - name: Tailscale OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:gha

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          cat > ~/.ssh/config <<'EOF'
          Host sauron encom *.tailbe71e1.ts.net
            StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      - name: Download build path
        uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.deploy_host }}

      - name: Switch running generation
        run: |
          BUILD="$(cat "build-${{ matrix.deploy_host }}")"

          CURRENT="$(ssh -o ConnectTimeout=10 "deploy@${{ matrix.deploy_host }}" 'readlink /run/current-system' 2>/dev/null || true)"
          if [ -n "$CURRENT" ] && [ "$CURRENT" = "$BUILD" ]; then
            echo "SKIP | ${{ matrix.deploy_host }} already on $BUILD, nothing to activate."
            exit 0
          fi

          ssh "deploy@${{ matrix.deploy_host }}" "sudo -n systemd-run --unit=nixos-manual-switch --collect --no-block '${BUILD}/bin/switch-to-configuration' switch"

  verify:
    name: Verify Nix generation
    needs: activate
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deploy_host: [encom, sauron]
    steps:
      - name: Tailscale OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:gha

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          cat > ~/.ssh/config <<'EOF'
          Host sauron encom *.tailbe71e1.ts.net
            StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      - name: Download build path
        uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.deploy_host }}

      - name: Check deploy status
        run: |
          BUILD="$(cat "build-${{ matrix.deploy_host }}")"
          for _ in $(seq 1 30); do
            CURRENT="$(ssh -o ConnectTimeout=10 "deploy@${{ matrix.deploy_host }}" 'readlink /run/current-system' 2>/dev/null || true)"
            if [ "$CURRENT" = "$BUILD" ]; then
              echo "SUCCESS | Generation in use: $CURRENT"
              exit 0
            fi
            sleep 20
          done

          echo "Deployment failed for ${{ matrix.deploy_host }}"
          exit 1
