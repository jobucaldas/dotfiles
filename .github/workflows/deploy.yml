name: Deploy Nix Hosts

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-nix-hosts
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy Nix Hosts
    needs: ci
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deploy_host: [encom, sauron]
    steps:
      - name: Tailscale OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:gha

      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: jobucaldas
          authToken: ${{ secrets.CACHIX_TOKEN }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          cat > ~/.ssh/config <<'EOF'
          Host *.tailbe71e1.ts.net
            StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      - name: Deploy Nix Host ${{ matrix.deploy_host }}
        working-directory: ./flake
        run: |
          # deploy-rs is pinned to a nixpkgs rev whose binary is already in
          # cache.nixos.org + jobucaldas.cachix.org. Rolling nixos-unstable
          # currently forces a from-source build whose cargo vendor download
          # 403s on static.crates.io from GitHub runners.
          # TODO: unpin once crates.io stops 403ing runner IPs.
          nix run github:NixOS/nixpkgs/efe6f071ede9d21c37462d2d6682d5e670099684#deploy-rs -- \
            .#${{ matrix.deploy_host }}
