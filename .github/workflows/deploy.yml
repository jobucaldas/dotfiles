name: Deploy Nix Hosts

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-nix-hosts
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy Nix Hosts
    needs: ci
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deploy_host: [encom, sauron]
    steps:
      - name: Tailscale OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:gha

      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: jobucaldas
          authToken: ${{ secrets.CACHIX_TOKEN }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          cat > ~/.ssh/config <<'EOF'
          Host *.tailbe71e1.ts.net
            StrictHostKeyChecking accept-new
          EOF

          chmod 600 ~/.ssh/config

      - name: Deploy Nix Host ${{ matrix.deploy_host }}
        working-directory: ./flake
        run: |
          # Stage the new generation in the bootloader without live-switching:
          # - deploy-rs can't build on runners right now (its cargo vendor
          #   sources 403 on static.crates.io from GitHub IPs, and the outputs
          #   are no longer in any binary cache).
          # - a live `switch` would restart sshd/tailscaled mid-activation and
          #   drop the very SSH connection the deploy runs over.
          # `boot` touches neither, so the deploy reports green; hosts pick up
          # the new generation on their next reboot.
          # nixpkgs resolves via the flake's own inputs, so it always matches
          # the system being deployed.
          nix run --inputs-from . nixpkgs#nixos-rebuild -- \
            boot --target-host deploy@${{ matrix.deploy_host }}.tailbe71e1.ts.net \
            --sudo --flake .#${{ matrix.deploy_host }}
