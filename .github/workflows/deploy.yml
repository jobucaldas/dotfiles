name: Deploy Nix Hosts

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      host:
        description: Host to deploy
        type: choice
        options: [all, encom, sauron]
        default: all

# Both hosts deploy independently
concurrency:
  group: deploy-nix-hosts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  encom:
    name: encom
    needs: validate
    if: ${{ github.event_name == 'push' || inputs.host == 'all' || inputs.host == 'encom' }}
    uses: ./.github/workflows/deploy-host.yml
    with:
      host: encom
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  sauron:
    name: sauron
    needs: validate
    if: ${{ github.event_name == 'push' || inputs.host == 'all' || inputs.host == 'sauron' }}
    uses: ./.github/workflows/deploy-host.yml
    with:
      host: sauron
    secrets: inherit
    permissions:
      contents: read
      id-token: write
