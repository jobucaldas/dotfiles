name: Deploy Nix Hosts

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      host:
        description: Host to deploy
        type: choice
        options: [all, encom, sauron]
        default: all

# Both hosts deploy independently
concurrency:
  group: deploy-nix-hosts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  # Build every selected host once on the runner and push to Cachix before any
  # deploy is allowed, so the hosts only substitute and never compile.
  build:
    name: Build and push to Cachix
    needs: validate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      HOSTS: ${{ (github.event_name == 'push' || inputs.host == 'all') && 'encom sauron' || inputs.host }}
    steps:
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Building the patched codex runs the runner out of memory, and
      # it is killed without swap.
      - name: Add extra swap
        run: |
          sudo fallocate -l 16G /extra-swapfile
          sudo chmod 600 /extra-swapfile
          sudo mkswap /extra-swapfile
          sudo swapon /extra-swapfile
          swapon --show

      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com https://nyx-cache.chaotic.cx/
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk=

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: jobucaldas
          authToken: ${{ secrets.CACHIX_TOKEN }}

      - name: Build and push
        working-directory: ./flake
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_TOKEN }}
        run: |
          # A failed build must fail this step instead of being masked by the pipe.
          set -o pipefail
          attrs=()
          for host in $HOSTS; do
            attrs+=(".#nixosConfigurations.${host}.config.system.build.toplevel")
            attrs+=(".#deploy.nodes.${host}.profiles.system.path")
          done
          # One derivation at a time: parallel Rust/LTO builds starve the runner
          # of memory and it drops off the server mid-build.
          nix build --max-jobs 1 --cores 4 --keep-going --no-link --print-out-paths "${attrs[@]}" |
            nix run nixpkgs#cachix -- push jobucaldas

  encom:
    name: encom
    needs: [validate, build]
    if: ${{ github.event_name == 'push' || inputs.host == 'all' || inputs.host == 'encom' }}
    uses: ./.github/workflows/deploy-host.yml
    with:
      host: encom
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  sauron:
    name: sauron
    needs: [validate, build]
    if: ${{ github.event_name == 'push' || inputs.host == 'all' || inputs.host == 'sauron' }}
    uses: ./.github/workflows/deploy-host.yml
    with:
      host: sauron
    secrets: inherit
    permissions:
      contents: read
      id-token: write
