name: CI Nix Flake

on:
  pull_request:

  workflow_call:

jobs:
  validate:
    name: Validate Nix Flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Format Nix Flake
        working-directory: ./flake
        run: nix fmt

      - name: Validate Nix Flake
        working-directory: ./flake
        run: nix flake check

  build:
    name: Build Nix Flake
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        deploy_host: [encom, sauron]
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: jobucaldas
          authToken: ${{ secrets.CACHIX_TOKEN }}

      - name: Build Nix Flake
        working-directory: ./flake
        run: nix build .#nixosConfigurations.${{ matrix.deploy_host }}.config.system.build.toplevel -o result

      - name: Save build path
        run: readlink flake/result > build-${{ matrix.deploy_host }}

      - name: Upload build path
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.deploy_host }}
          path: build-${{ matrix.deploy_host }}
          retention-days: 1

      - name: Vulnix scan
        working-directory: ./flake
        # vulnix exits 2 when findings exist; only fail on real errors
        run: nix run nixpkgs#vulnix -- --json result > vulnix.json || [ $? -eq 2 ]

      - name: Convert to SARIF
        run: python3 .github/scripts/vulnix_to_sarif.py flake/vulnix.json flake/vulnix.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: flake/vulnix.sarif
          category: vulnix-${{ matrix.deploy_host }}
