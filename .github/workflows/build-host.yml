name: Build Nix Host

on:
  workflow_call:
    inputs:
      host:
        description: Host to build and scan
        type: string
        required: true

jobs:
  build:
    name: Build Nix Flake
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: jobucaldas
          authToken: ${{ secrets.CACHIX_TOKEN }}

      - name: Build Nix Flake
        working-directory: ./flake
        run: nix build .#nixosConfigurations.${{ inputs.host }}.config.system.build.toplevel -o result

      - name: Save build path
        run: readlink flake/result > build-${{ inputs.host }}

      - name: Upload build path
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ inputs.host }}
          path: build-${{ inputs.host }}
          retention-days: 1

      - name: Vulnix scan
        working-directory: ./flake
        # vulnix exits 2 when findings exist; only fail on real errors.
        # Whitelist filters triaged false positives (pname collisions).
        # nvd.nist.gov often times out mid-download (its client timeout is
        # 10s). Retry, then continue with an empty report so a NIST outage
        # does not skip the deploy. The next green scan replaces it.
        run: |
          attempt=1
          until nix run nixpkgs#vulnix -- -w vulnix-whitelist.toml --json result > vulnix.json; do
            status=$?
            if [ "$status" -eq 2 ]; then
              exit 0
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "vulnix could not update the NVD feed after ${attempt} attempts (exit ${status}); deploying without a new scan"
              echo '[]' > vulnix.json
              exit 0
            fi
            echo "vulnix failed (attempt ${attempt}, exit ${status}); retrying in 30s"
            attempt=$((attempt + 1))
            sleep 30
          done

      - name: Convert to SARIF
        # Default: error only (CVSS >= 7 or known-exploited). Use --all to debug.
        run: python3 .github/scripts/vulnix_to_sarif.py flake/vulnix.json flake/vulnix.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: flake/vulnix.sarif
          category: vulnix-${{ inputs.host }}
